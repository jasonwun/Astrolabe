# Synthetic CRD for manual UI checks of the Custom Resources section
# (docs/agents/manual-check.md). dev/demo.sh applies it, and waits for it
# to be Established, before dev/demo.yaml, which holds a Widget.
# Cluster-scoped and identical in every worktree, so `dev/demo.sh delete`
# leaves it in place. Plausible shape written by hand, never captured from
# a server.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: widgets.demo.astrolabe.dev}
spec:
  group: demo.astrolabe.dev
  scope: Namespaced
  names: {kind: Widget, plural: widgets, singular: widget}
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        x-kubernetes-preserve-unknown-fields: true
    additionalPrinterColumns:
    - {name: Size, type: string, jsonPath: .spec.size}
