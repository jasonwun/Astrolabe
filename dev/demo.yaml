# Synthetic demo objects for manual UI checks (docs/agents/manual-check.md).
# Apply with dev/demo.sh, which renames the astrolabe-demo namespace per worktree.
# Plausible shapes written by hand, never captured from a server.
apiVersion: v1
kind: Namespace
metadata: {name: astrolabe-demo}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: astrolabe-demo}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      initContainers:
      - {name: init, image: busybox:1.36, command: [sh, -c, "true"]}
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports: [{name: http, containerPort: 80}]
---
apiVersion: v1
kind: Pod
metadata: {name: standalone, namespace: astrolabe-demo}
spec:
  restartPolicy: Never
  containers:
  - {name: sleep, image: busybox:1.36, command: [sleep, "3600"]}
---
# Two running containers and an init container: the Logs/Exec/Port Forward
# pickers list different containers.
apiVersion: v1
kind: Pod
metadata: {name: multi, namespace: astrolabe-demo}
spec:
  initContainers:
  - {name: setup, image: busybox:1.36, command: [sh, -c, "true"]}
  containers:
  - name: app
    image: busybox:1.36
    command: [sleep, "3600"]
    ports: [{name: http, containerPort: 8080}]
  - name: sidecar
    image: busybox:1.36
    command: [sleep, "3600"]
    ports: [{name: admin, containerPort: 9901}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: astrolabe-demo}
spec:
  selector: {app: web}
  sessionAffinity: ClientIP
  sessionAffinityConfig: {clientIP: {timeoutSeconds: 150}}
  internalTrafficPolicy: Cluster
  trafficDistribution: PreferClose
  publishNotReadyAddresses: false
  externalIPs: [192.0.2.10]
  ports:
  - {name: http, port: 8080, targetPort: http, protocol: TCP}
  - {name: dns, port: 53, protocol: UDP}
---
apiVersion: v1
kind: Service
metadata: {name: web-nodeport, namespace: astrolabe-demo}
spec:
  type: NodePort
  selector: {app: web}
  ports: [{name: http, port: 80, targetPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: web-lb, namespace: astrolabe-demo}
spec:
  type: LoadBalancer
  selector: {app: web}
  allocateLoadBalancerNodePorts: false
  loadBalancerClass: example.com/synthetic
  loadBalancerIP: 192.0.2.20
  externalTrafficPolicy: Local
  externalIPs: [192.0.2.20]
  ports: [{port: 80, targetPort: 80}]
---
# No selector, so no EndpointSlices: the Service hides that section (#58).
apiVersion: v1
kind: Service
metadata: {name: external-db, namespace: astrolabe-demo}
spec:
  ports: [{port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: shop, namespace: astrolabe-demo}
spec:
  defaultBackend: {service: {name: web, port: {number: 8080}}}
  tls: [{hosts: [shop.example], secretName: shop-tls}]
  rules:
  - host: shop.example
    http:
      paths:
      - {path: /, pathType: Prefix, backend: {service: {name: web, port: {name: http}}}}
      - {path: /api, pathType: Prefix, backend: {service: {name: web-nodeport, port: {number: 80}}}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: app, namespace: astrolabe-demo}
data:
  mode: production
  # Overlong for the Key column: shows the cell ellipsis (#75).
  log-shipping.fluent-bit-sidecar.override.conf: enabled
  nginx.conf: |
    server {
      listen 80;
    }
binaryData:
  logo.png: iVBORw0KGgo=
---
apiVersion: v1
kind: Secret
metadata: {name: db, namespace: astrolabe-demo, labels: {app: db}}
type: Opaque
stringData: {password: hunter2, user: admin}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: db, namespace: astrolabe-demo}
spec:
  serviceName: db
  replicas: 1
  selector: {matchLabels: {app: db-stateful}}
  template:
    metadata: {labels: {app: db-stateful}}
    spec:
      containers:
      - {name: db, image: busybox:1.36, command: [sleep, "3600"]}
---
apiVersion: apps/v1
kind: ReplicaSet
metadata: {name: worker, namespace: astrolabe-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      containers:
      - {name: worker, image: busybox:1.36, command: [sleep, "3600"]}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: agent, namespace: astrolabe-demo}
spec:
  selector: {matchLabels: {app: agent}}
  template:
    metadata: {labels: {app: agent}}
    spec:
      containers:
      - {name: agent, image: busybox:1.36, command: [sleep, "3600"]}
---
apiVersion: batch/v1
kind: Job
metadata: {name: migrate, namespace: astrolabe-demo}
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - {name: migrate, image: busybox:1.36, command: [sh, -c, "echo migrated"]}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: nightly, namespace: astrolabe-demo}
spec:
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - {name: nightly, image: busybox:1.36, command: [sh, -c, "date"]}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: paused, namespace: astrolabe-demo}
spec:
  schedule: "0 6 * * 1"
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - {name: paused, image: busybox:1.36, command: [sh, -c, "date"]}
---
# Counts only, so the demo's Pods (no requests of their own) still schedule.
apiVersion: v1
kind: ResourceQuota
metadata: {name: counts, namespace: astrolabe-demo}
spec:
  hard: {pods: "20", services: "10", configmaps: "10", requests.storage: 10Gi}
---
# Scoped to a PriorityClass none of the demo's Pods use.
apiVersion: v1
kind: ResourceQuota
metadata: {name: high-priority, namespace: astrolabe-demo}
spec:
  hard: {requests.cpu: "2", requests.memory: 1G}
  scopeSelector:
    matchExpressions:
    - {operator: In, scopeName: PriorityClass, values: [high, critical]}
---
apiVersion: v1
kind: LimitRange
metadata: {name: defaults, namespace: astrolabe-demo}
spec:
  limits:
  - type: Container
    min: {cpu: 10m, memory: 8Mi}
    max: {cpu: "2", memory: 1Gi}
    default: {cpu: 500m, memory: 256Mi}
    defaultRequest: {cpu: 100m, memory: 64Mi}
    maxLimitRequestRatio: {cpu: "10"}
  - type: PersistentVolumeClaim
    min: {storage: 1Gi}
    max: {storage: 10Gi}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: web, namespace: astrolabe-demo}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: web}
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
  - type: Resource
    resource: {name: memory, target: {type: AverageValue, averageValue: 200Mi}}
