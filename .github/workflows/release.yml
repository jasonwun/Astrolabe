name: Release

# Started by hand from the Actions tab (docs/agents/release.md). Nothing is
# typed in: the version is the workspace `version`.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Run from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "releases are cut from main, not $GITHUB_REF" >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          # Every tag, for the tag-exists check and the generated notes.
          fetch-depth: 0
      - name: Tag must not exist
        id: version
        run: |
          version=$(cargo pkgid -p astrolabe --locked | sed 's/.*[#@]//')
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "tag v$version already exists; bump the workspace version first" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
      - name: Build the .dmg
        id: package
        run: echo "dmg=$(dev/package.sh | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DMG: ${{ steps.package.outputs.dmg }}
        run: |
          # Every Release is a pre-release until the maintainer decides
          # otherwise: there is deliberately no switch for a full one.
          gh release create "v$VERSION" "$DMG" \
            --target "$GITHUB_SHA" \
            --title "Astrolabe $VERSION" \
            --prerelease \
            --generate-notes \
            --notes-file .github/release-header.md
