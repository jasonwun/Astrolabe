name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Dependency-direction guard: the kube layer must stay gpui-free.
      - name: astrolabe-kube must not depend on gpui
        run: |
          if cargo tree -p astrolabe-kube --locked | grep -qi gpui; then
            echo "gpui found in astrolabe-kube's dependency tree" >&2
            exit 1
          fi

  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  e2e:
    # kind needs Docker, which GitHub's macOS runners don't have, so this
    # job runs on Linux; astrolabe-kube is platform-agnostic.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - uses: helm/kind-action@v1
      - run: cargo test -p astrolabe-kube --locked --test e2e_cluster -- --ignored --test-threads=1

  mutants:
    # astrolabe-kube's zero-missed mutant bar (docs/agents/testing.md),
    # scoped to the code this PR touches. Linux: the crate is gpui-free.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
        with:
          key: mutants
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - run: git diff "origin/${{ github.base_ref }}...HEAD" > pr.diff
      - run: cargo mutants -p astrolabe-kube --cargo-arg=--locked --in-diff pr.diff -j 2

  e2e-legacy-discovery:
    # A pre-aggregated-discovery apiserver (aggregated discovery is
    # default-on from 1.27): proves discover()'s per-group fallback on a
    # real server, which the hermetic suite only covers with a mock.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - uses: helm/kind-action@v1
        with:
          node_image: kindest/node:v1.25.16
      - run: cargo test -p astrolabe-kube --locked --test e2e_cluster -- --ignored --test-threads=1 crd_
