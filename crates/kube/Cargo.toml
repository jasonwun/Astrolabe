[package]
name = "astrolabe-kube"
edition.workspace = true
publish.workspace = true

[dependencies]
kube.workspace = true
k8s-openapi.workspace = true
serde-saphyr.workspace = true
saphyr.workspace = true
serde_json.workspace = true
thiserror.workspace = true
futures.workspace = true
tracing.workspace = true
# Exec stream pump and port-forward listener (#17): the IO traits
# kube-client's streams use, and the local TCP listener.
tokio = { workspace = true, features = ["io-util", "macros", "net"] }

[dev-dependencies]
http.workspace = true
# The notify-cost churn example (#106): a multi-threaded runtime and its
# rate timer.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tower.workspace = true
[lints]
workspace = true
