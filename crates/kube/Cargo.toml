[package]
name = "astrolabe-kube"
edition.workspace = true
publish.workspace = true

[dependencies]
kube.workspace = true
k8s-openapi.workspace = true
serde-saphyr.workspace = true
saphyr.workspace = true
serde_json.workspace = true
thiserror.workspace = true
futures.workspace = true
tracing.workspace = true
# Exec stream pump and port-forward listener (#17): the IO traits
# kube-client's streams use, and the local TCP listener. The watch relist
# loop's retry timers (#156).
tokio = { workspace = true, features = ["io-util", "macros", "net", "time"] }

[dev-dependencies]
# The e2e CRD test builds a Catalog from a live Discovery result (#154).
# Integration tests only: the library never depends on the model layer.
astrolabe-model.workspace = true
http.workspace = true
# The notify-cost churn example (#106): a multi-threaded runtime and its
# rate timer. The watch relist tests' paused clock (#156).
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }
tower.workspace = true
# The watch relist test reads the cluster layer's logs (#156).
tracing-subscriber.workspace = true

[lints]
workspace = true
