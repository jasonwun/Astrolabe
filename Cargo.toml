[workspace]
resolver = "3"
members = ["crates/app", "crates/kube", "crates/terminal", "spikes/*"]

[workspace.package]
edition = "2024"
publish = false

# All third-party versions are declared here, single point of truth;
# members only write `workspace = true`. gpui-kit / alacritty_terminal /
# k8s-openapi are exact (`=`) pins; kube follows the survey conclusion
# ("4.0", ws + rustls-tls). `Cargo.lock` is committed on top. Upgrades
# are explicit actions — see README "Dependency upgrades".
[workspace.dependencies]
gpui-kit = "=0.8.1"
alacritty_terminal = "=0.26.0"
k8s-openapi = { version = "=0.28", features = ["v1_36"] }
kube = { version = "4.0", features = ["runtime", "ws", "rustls-tls"] }
# YAML payload parse for SSA apply (#21): same crate+version family
# kube-client 4.x itself uses, so no new dependency family.
serde-saphyr = "=0.0.29"
# YAML span AST for apply-error line mapping (#10 resolution): exact pin,
# 0.x versions are followed deliberately.
saphyr = "=0.0.6"
serde_json = "1"
thiserror = "2"
regex = "1"
cronspeak = "=0.1.1"
futures = "0.3"
# Development logging for the watch recovery path (#31): opt-in via RUST_LOG.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
# Dev-only: mock `kube::Client` services for apply orchestration tests.
http = "1"
tower = { version = "0.5", features = ["util"] }
# Benchmarks only (spikes/*): RSS and load-average samples, gpui frame-trace
# timestamps, and the editor benchmark's incremental-parse measurement.
libc = "0.2"
web-time = "0.2"
tree-sitter = "0.26"

[workspace.dependencies.astrolabe-kube]
path = "crates/kube"

[workspace.dependencies.astrolabe-terminal]
path = "crates/terminal"

[workspace.dependencies.spike-support]
path = "spikes/support"
