# Feasibility and performance spike, not production code: run by hand on
# every dependency upgrade (docs/agents/spike-regression.md).
[package]
name = "terminal-spike"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
# `profiler` turns on gpui's frame-timing trace for the measured-results
# section of the README.
gpui-kit = { workspace = true, features = ["profiler"] }
# The VT engine under test (crates.io, not the zed-industries fork).
alacritty_terminal.workspace = true
# Used only for a mach task_info() RSS sample on macOS (log-flood mode).
# Already in gpui's tree.
libc.workspace = true
