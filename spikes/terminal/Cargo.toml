# Terminal feasibility and performance benchmark, rerun on every dependency
# upgrade (docs/agents/spike-regression.md).
[package]
name = "terminal-spike"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
# `profiler` turns on gpui's frame-timing trace for the measured-results
# section of the README.
gpui-kit = { workspace = true, features = ["profiler"] }
# The VT engine under test (crates.io, not the zed-industries fork).
alacritty_terminal.workspace = true
# RSS and load-average samples.
spike-support.workspace = true
