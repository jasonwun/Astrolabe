# DataTable performance benchmark, rerun on every dependency upgrade
# (docs/agents/spike-regression.md).
[package]
name = "datatable-spike"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
# `profiler` turns on gpui's frame-timing trace
# (gpui_kit::profiler::FrameTimingCollector) so the overlay can report real
# draw/present timings instead of a timer-based approximation.
gpui-kit = { workspace = true, features = ["profiler"] }
# Frame stats, RSS, load average, and the scripted mode's async helpers.
spike-support.workspace = true
